<article class="recap card">
  <div class="eyebrow">{{ t.recap }} <span class="pill">{{ t.episode }} {{ episode.tick }}</span></div>
  <h2>{{ episode.headline }}</h2>
  <p class="recap-story">{{ episode.what_happened }}</p>
  <div class="meaning"><span class="eyebrow">{{ t.why }}</span><p>{{ episode.why_it_matters }}</p></div>
  <p class="teaser">↗ {{ episode.teaser }}</p>
</article>
