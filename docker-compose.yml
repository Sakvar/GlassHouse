services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: glasshouse
      POSTGRES_PASSWORD: glasshouse
      POSTGRES_DB: glasshouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glasshouse -d glasshouse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
