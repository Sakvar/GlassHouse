[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glasshouse"
version = "0.2.0"
description = "GlassHouse Live — persistent bilingual AI reality show"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "jinja2>=3.1.6,<4",
    "argon2-cffi>=23,<26",
    "itsdangerous>=2.2,<3",
    "python-multipart>=0.0.20,<1",
    "email-validator>=2,<3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/glasshouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "evaluation: real LLM evaluation tests (not run in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
